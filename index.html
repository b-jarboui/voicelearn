<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceLearn Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="scenes.css?v=6">
<style>
/* Narrated presentation: the stage plays like a video; one Pause/Continue control. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#142033; --muted:#5B6B82; --line:#D5DDE7;
  --accent:#1F5EFF; --accent-ink:#FFFFFF; --ok:#1E8E5A; --warn:#B26A00;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131C; --surface:#151D29; --ink:#E8EEF6; --muted:#93A3B8; --line:#263245;
  --accent:#6C9BFF; --accent-ink:#0D131C; --ok:#3DD68C; --warn:#FFB84D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131C; --surface:#151D29; --ink:#E8EEF6; --muted:#93A3B8; --line:#263245;
  --accent:#6C9BFF; --accent-ink:#0D131C; --ok:#3DD68C; --warn:#FFB84D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);padding:0 16px 120px}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding-block:14px}
.brand{font:800 20px var(--display);letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.brand span{color:var(--accent)}
main{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px} h2{font-size:21px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;min-width:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.now{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player .stage{height:max(340px,calc(100dvh - 250px))}
.cc{min-height:3.2em;font-size:18px;line-height:1.45;text-align:center;padding-inline:8px;text-wrap:balance}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .status{flex:1;min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-course{font-size:14px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vbtn{padding:7px 12px;font-size:15px;white-space:nowrap}
.vpanel{position:fixed;z-index:20;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top,0px));max-width:420px;margin-left:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.vpanel select,.vpanel input[type=range]{width:100%;font:inherit}
.vpanel select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.vpanel input[type=range]{accent-color:var(--accent)}
.send{margin-top:6px}
.fld{display:grid;gap:4px;font-size:15px;color:var(--muted)}
.fld input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#fsBtn{display:none;padding:12px 14px;border-radius:99px;font-size:18px;line-height:1}
body[data-view="player"] #fsBtn{display:block}
/* Full screen player: stage fills the screen, caption + controls float over it like a video player. */
body.fs{overflow:hidden}
body.fs header,body.fs .vpanel{display:none}
/* The picture stops above a black caption band, so subtitles and controls never cover content. */
body.fs{background:#000}
body.fs .player .stage{position:fixed;left:0;right:0;top:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));height:auto;border-radius:0;z-index:50}
body.fs .cc{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0;height:calc(150px + env(safe-area-inset-bottom,0px));
  padding:12px 20px 0;color:#fff;background:#000;pointer-events:none}
body.fs .bar{z-index:52;background:transparent;border:0}
body.fs .bar .status{color:rgba(255,255,255,.8)}
body.fs #fsBtn{background:rgba(20,20,24,.55);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
body.fs .send{display:none}
#toggle{min-width:170px;padding:14px 22px;font-size:19px;border-radius:99px}
</style>
</head>
<body>
<header>
  <button class="brand" id="home" aria-label="Course home">Voice<span>Learn</span></button>
  <span class="muted hdr-course">PHQE820 · Data Quality</span>
  <button id="vBtn" class="vbtn" aria-label="Voice and speed settings">🔊 Voice</button>
</header>
<div class="vpanel card" id="vPanel" hidden>
  <div class="row" style="justify-content:space-between"><b>Voice &amp; speed</b><button id="vClose" aria-label="Close">✕</button></div>
  <label class="fld">Voice<select id="vVoice"></select></label>
  <label class="fld">Speed <output id="vRateOut">1×</output><input id="vRate" type="range" min="0.75" max="2" step="0.25" value="1"></label>
  <div class="row muted" style="justify-content:space-between;font-size:13px"><span>0.75×</span><span>1×</span><span>1.5×</span><span>2×</span></div>
  <label class="fld">Tone <output id="vPitchOut">normal</output><input id="vPitch" type="range" min="0.5" max="1.5" step="0.1" value="1"></label>
  <div class="row muted" style="justify-content:space-between;font-size:13px"><span>Deeper</span><span>Higher</span></div>
  <button id="vTest">▶ Test voice</button>
  <div class="muted" style="font-size:13px">Voices come from your phone. For a male voice on Android: Settings → Text-to-speech → Speech Services by Google → ⚙️ → Install voice data → English → pick a male voice.</div>
</div>
<main id="main"></main>
<div class="bar"><div class="bar-in">
  <div class="status" id="status" role="status">Ready</div>
  <button id="fsBtn" aria-label="Full screen">⛶</button>
  <button class="primary" id="toggle">▶ Continue</button>
</div></div>

<script src="course.js?v=2"></script>
<script src="adaptive.js?v=1"></script>
<script src="scenes.js?v=7"></script>
<script src="player.js?v=11"></script>
</body>
</html>
