<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceLearn Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="scenes.css?v=5">
<style>
/* Narrated presentation: the stage plays like a video; one Pause/Continue control. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#142033; --muted:#5B6B82; --line:#D5DDE7;
  --accent:#1F5EFF; --accent-ink:#FFFFFF; --ok:#1E8E5A; --warn:#B26A00;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131C; --surface:#151D29; --ink:#E8EEF6; --muted:#93A3B8; --line:#263245;
  --accent:#6C9BFF; --accent-ink:#0D131C; --ok:#3DD68C; --warn:#FFB84D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131C; --surface:#151D29; --ink:#E8EEF6; --muted:#93A3B8; --line:#263245;
  --accent:#6C9BFF; --accent-ink:#0D131C; --ok:#3DD68C; --warn:#FFB84D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);padding:0 16px 120px}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding-block:14px}
.brand{font:800 20px var(--display);letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.brand span{color:var(--accent)}
main{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px} h2{font-size:21px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;min-width:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.now{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player .stage{height:max(340px,calc(100dvh - 250px))}
.cc{min-height:3.2em;font-size:18px;line-height:1.45;text-align:center;padding-inline:8px;text-wrap:balance}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .status{flex:1;min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toggle{min-width:170px;padding:14px 22px;font-size:19px;border-radius:99px}
</style>
</head>
<body>
<header>
  <button class="brand" id="home" aria-label="Course home">Voice<span>Learn</span></button>
  <span class="muted" style="font-size:14px">PHQE820 · Data Quality</span>
</header>
<main id="main"></main>
<div class="bar"><div class="bar-in">
  <div class="status" id="status" role="status">Ready</div>
  <button class="primary" id="toggle">▶ Continue</button>
</div></div>

<script src="course.js"></script>
<script src="adaptive.js?v=1"></script>
<script src="scenes.js?v=5"></script>
<script src="player.js?v=4"></script>
</body>
</html>
