<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceLearn Style Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&family=Anton&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Lab: pick a style, pick a section, play it with narration. The stage is a phone-shaped frame. */
:root{--bg:#EEF2F6;--surface:#fff;--ink:#142033;--muted:#5B6B82;--line:#D5DDE7;--accent:#1F5EFF;--accent-ink:#fff;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D131C;--surface:#151D29;--ink:#E8EEF6;--muted:#93A3B8;--line:#263245;--accent:#6C9BFF;--accent-ink:#0D131C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D131C;--surface:#151D29;--ink:#E8EEF6;--muted:#93A3B8;--line:#263245;--accent:#6C9BFF;--accent-ink:#0D131C;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:0 16px 24px}
header{max-width:460px;margin:0 auto;padding-block:12px 8px;display:grid;gap:8px}
h1{font:800 20px var(--display);margin:0} h1 span{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button,.ctl button{font:inherit;font-size:14px;white-space:nowrap;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.note{font-size:14px;color:var(--muted);min-height:2.6em}
#frame{position:relative;max-width:460px;margin:0 auto;height:min(760px,calc(100dvh - 250px));min-height:420px;border-radius:22px;overflow:hidden;
  box-shadow:0 20px 60px rgba(10,20,40,.25);background:#000}
#frame > .stage-root{position:absolute;inset:0}
.cc{max-width:460px;margin:10px auto 0;text-align:center;font-size:16px;min-height:3em;text-wrap:balance}
.ctl{max-width:460px;margin:8px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:9px 20px}
/* Full screen: the frame fills the screen; caption and controls float over it like a video player. */
body.fs{overflow:hidden}
body.fs #frame{position:fixed;inset:0;max-width:none;height:100dvh;min-height:0;border-radius:0;z-index:50;margin:0}
body.fs .cc{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:none;margin:0;padding:48px 20px calc(78px + env(safe-area-inset-bottom,0px));
  color:#fff;font-size:18px;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
body.fs .ctl{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:52;margin:0}
body.fs .ctl button{background:rgba(20,20,24,.55);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
body.fs .ctl .primary{background:#fff;color:#111;border-color:#fff}
body.fs header,body.fs #replay,body.fs #quiet{display:none}
</style>
</head>
<body>
<header>
  <h1>Voice<span>Learn</span> · Style lab</h1>
  <div class="tabs" id="styles" role="group" aria-label="Animation style"></div>
  <div class="tabs" id="sections" role="group" aria-label="Section"></div>
  <div class="note" id="note"></div>
</header>
<div id="frame"></div>
<div class="cc" id="cc">Tap Play to hear and watch the section.</div>
<div class="ctl">
  <button class="primary" id="play">▶ Play</button>
  <button id="replay">↺ Replay</button>
  <button id="quiet">Silent preview</button>
  <button id="fs" aria-label="Full screen">⛶ Full screen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="content.js?v=1"></script>
<script src="style-blueprint.js?v=1"></script>
<script src="style-kinetic.js?v=1"></script>
<script src="style-whiteboard.js?v=1"></script>
<script src="style-story.js?v=1"></script>
<script src="style-codex.js?v=1" onerror="this.remove()"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const synth = window.speechSynthesis;
  let style = STYLES[0], section = LAB.sections[0], tok = 0, playing = false, cur = -1, timer = null;

  function voice() {
    const vs = synth.getVoices().filter((v) => /^en/i.test(v.lang));
    let uri = ""; try { uri = (JSON.parse(localStorage.getItem("voicelearn.voice.v1")) || {}).uri || ""; } catch (e) {}
    return vs.find((v) => v.voiceURI === uri) || vs.find((v) => v.localService && /en[-_]US/i.test(v.lang)) || vs[0];
  }
  function tabs() {
    $("styles").innerHTML = STYLES.map((s) => `<button data-s="${s.id}" aria-pressed="${s === style}">${s.name}</button>`).join("");
    $("sections").innerHTML = LAB.sections.map((s) => `<button data-x="${s.id}" aria-pressed="${s === section}">${s.title}</button>`).join("");
    $("note").textContent = style.note;
    document.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { style = STYLES.find((s) => s.id === b.dataset.s); restart(); }));
    document.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { section = LAB.sections.find((s) => s.id === b.dataset.x); restart(); }));
  }
  function stop() { tok++; synth.cancel(); clearTimeout(timer); playing = false; $("play").textContent = "▶ Play"; }
  function restart(autoplay = playing) {
    stop(); tabs(); cur = -1;
    $("frame").innerHTML = '<div class="stage-root"></div>';
    const root = $("frame").firstChild;
    style.mount(root); style.load(section); style.step(-1);
    $("cc").textContent = section.title;
    if (autoplay) play(0);
  }
  function show(i) { cur = i; style.step(i); $("cc").textContent = section.sentences[i] || ""; }
  function play(from) {
    stop(); playing = true; $("play").textContent = "⏸ Pause";
    const my = tok; let i = from;
    const next = () => {
      if (my !== tok) return;
      if (i >= section.sentences.length) { playing = false; $("play").textContent = "▶ Play"; return; }
      show(i);
      const u = new SpeechSynthesisUtterance(section.sentences[i]); const v = voice();
      if (v) { u.voice = v; u.lang = v.lang; }
      let done = false, quiet = 0, started = false;
      const fin = () => { if (done || my !== tok) return; done = true; clearInterval(dog); i++; setTimeout(next, 250); };
      const dog = setInterval(() => { if (my !== tok) return clearInterval(dog); if (synth.speaking) { started = true; quiet = 0; } else if (++quiet >= (started ? 3 : 10)) fin(); }, 500);
      u.onend = fin; u.onerror = (e) => { if (e.error !== "interrupted" && e.error !== "canceled") fin(); };
      synth.speak(u);
    };
    next();
  }
  // Silent preview: steps through moments on a timer (for comparing looks quickly).
  function quiet(from = 0) {
    stop(); playing = false; const my = tok; let i = from;
    const go = () => { if (my !== tok || i >= section.sentences.length) return; show(i++); timer = setTimeout(go, 2600); };
    go();
  }
  $("play").onclick = () => (playing ? stop() : play(cur >= 0 && cur < section.sentences.length - 1 ? cur : 0));
  $("replay").onclick = () => { restart(false); play(0); };
  $("quiet").onclick = () => { restart(false); quiet(0); };
  // Full screen: real Fullscreen API where allowed (Android, desktop), immersive CSS mode everywhere (iPhone).
  function setFs(on) {
    document.body.classList.toggle("fs", on);
    $("fs").textContent = on ? "✕ Exit" : "⛶ Full screen";
    try {
      if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (e) {}
    // let the style re-measure the new frame size
    setTimeout(() => style.step(cur), 350);
  }
  $("fs").onclick = () => setFs(!document.body.classList.contains("fs"));
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("fs")) setFs(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("fs")) setFs(false); });
  window.__lab = { show, restart, setStyle: (id) => { style = STYLES.find((s) => s.id === id); restart(false); }, setSection: (id) => { section = LAB.sections.find((s) => s.id === id); restart(false); } };
  restart(false);
})();
</script>
</body>
</html>
